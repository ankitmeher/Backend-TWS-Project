name: CI - Build Check

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Enable Docker Buildx (required for platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image for x86 (amd64)
      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t buy-wait-api \
            -f "FAST API/Dockerfile" "FAST API" \
            --load
